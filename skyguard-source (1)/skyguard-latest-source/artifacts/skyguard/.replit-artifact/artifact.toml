kind = "web"
previewPath = "/"
title = "SkyGuard"
description = "A drone-inspired environmental monitoring dashboard for exploring synthetic air-quality readings by location and altitude. It simulates sampling missions, highlights potential particulate hotspots using a visible threshold, and shows data coverage and quality limitations."
version = "1.0.0"
id = "artifacts/skyguard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25808

[services.development]
run = "pnpm --filter @workspace/skyguard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skyguard", "run", "build" ]
serve = "static"
publicDir = "artifacts/skyguard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25808"
BASE_PATH = "/"
