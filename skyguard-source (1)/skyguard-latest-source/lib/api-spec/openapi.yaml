openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /environment:
    get:
      operationId: getEnvironment
      tags: [environment]
      summary: Real station observations and weather near a monitoring area
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, minimum: 5, maximum: 150, default: 50 } }
      responses:
        "200":
          description: Observations with independent provider availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentReport" }
        "400":
          description: Invalid coordinates or radius
        "429":
          description: Too many requests
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    EnvironmentReport:
      type: object
      required: [fetchedAt, latitude, longitude, radiusKm, observations, weather, providers, satellite]
      properties:
        fetchedAt: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        radiusKm: { type: number }
        observations:
          type: array
          items: { $ref: "#/components/schemas/StationObservation" }
        weather:
          anyOf:
            - { $ref: "#/components/schemas/WeatherObservation" }
            - { type: "null" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderStatus" }
        satellite:
          anyOf:
            - { $ref: "#/components/schemas/SatelliteContext" }
            - { type: "null" }
    StationObservation:
      type: object
      required: [id, stationId, stationName, latitude, longitude, elevationMeters, pollutant, value, unit, source, agency, observedAt, distanceKm, preliminary, quality]
      properties:
        id: { type: string }
        stationId: { type: string }
        stationName: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        elevationMeters: { type: [number, "null"] }
        pollutant: { type: string }
        value: { type: number }
        unit: { type: string }
        source: { type: string }
        agency: { type: string }
        observedAt: { type: string }
        distanceKm: { type: number }
        preliminary: { type: boolean }
        quality: { type: string, enum: [current, outdated] }
    WeatherObservation:
      type: object
      required: [stationId, stationName, latitude, longitude, observedAt, temperatureC, humidityPercent, windSpeedMps, windDirectionDegrees, windGustMps, description, sourceUrl, quality]
      properties:
        stationId: { type: string }
        stationName: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        observedAt: { type: string }
        temperatureC: { type: [number, "null"] }
        humidityPercent: { type: [number, "null"] }
        windSpeedMps: { type: [number, "null"] }
        windDirectionDegrees: { type: [number, "null"] }
        windGustMps: { type: [number, "null"] }
        description: { type: string }
        sourceUrl: { type: string }
        quality: { type: string, enum: [current, outdated] }
    ProviderStatus:
      type: object
      required: [id, name, status, message, sourceUrl, refreshedAt, nextRefreshAt]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [ok, stale, unavailable, not_configured, context] }
        message: { type: string }
        sourceUrl: { type: string }
        refreshedAt: { type: [string, "null"] }
        nextRefreshAt: { type: [string, "null"] }
    SatelliteContext:
      type: object
      required: [imageUrl, date, sourceUrl, description]
      properties:
        imageUrl: { type: string }
        date: { type: string }
        sourceUrl: { type: string }
        description: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

